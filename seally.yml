services:
  seally:
    image: ${SEALLY_IMAGE:?Set SEALLY_IMAGE to a versioned Seally image or digest}
    container_name: seally
    restart: unless-stopped
    volumes:
      # 必须与 Seafile 服务使用同一个宿主机目录，并保持容器内路径为 /shared。
      - ${SEAFILE_VOLUME:-/opt/seafile-data}:/shared

      # 可选：先在宿主机挂载 NFS，再取消下一行注释。
      # - ${SEALLY_NFS_VOLUME:-/mnt/nfs}:/mnt/nfs
    environment:
      - TZ=${TIME_ZONE:-Etc/UTC}

      # Seafile 数据库。四种受支持组合的官方服务名均为 db。
      - SEAFILE_MYSQL_DB_HOST=${SEAFILE_MYSQL_DB_HOST:-db}
      - SEAFILE_MYSQL_DB_PORT=${SEAFILE_MYSQL_DB_PORT:-3306}
      - SEAFILE_MYSQL_DB_USER=${SEAFILE_MYSQL_DB_USER:-seafile}
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_MYSQL_DB_PASSWORD:?Variable is not set or empty}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=${SEAFILE_MYSQL_DB_CCNET_DB_NAME:-ccnet_db}
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=${SEAFILE_MYSQL_DB_SEAFILE_DB_NAME:-seafile_db}
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=${SEAFILE_MYSQL_DB_SEAHUB_DB_NAME:-seahub_db}

      # Seafile 13 复用其 CACHE_PROVIDER；Seafile 12 未定义该变量，默认使用 Memcached。
      - CACHE_PROVIDER=${CACHE_PROVIDER:-memcached}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MEMCACHED_HOST=${MEMCACHED_HOST:-memcached}
      - MEMCACHED_PORT=${MEMCACHED_PORT:-11211}

      # 浏览器访问使用公开域名；容器内 Seafile 地址使用程序默认值 http://seafile:80。
      - SM_SEAFILE_PUBLIC_URL=${SEAFILE_SERVER_PROTOCOL:-http}://${SEAFILE_SERVER_HOSTNAME:?Variable is not set or empty}
      - SM_JWT_SECRET=${JWT_PRIVATE_KEY:?Variable is not set or empty}
      - SM_SESSION_SECRET=${SM_SESSION_SECRET:?Variable is not set or empty}

      # 云盘应用身份、OAuth Secret 与传输参数由管理员在 Seally Web 设置页管理。

    labels:
      # 与 Seafile 共用域名；Caddy 去掉 /mate 前缀后转发到 Seally 8080。
      caddy: ${SEAFILE_SERVER_PROTOCOL:-http}://${SEAFILE_SERVER_HOSTNAME:?Variable is not set or empty}
      caddy.handle_path: /mate/*
      caddy.handle_path.reverse_proxy: "{{upstreams 8080}}"
    depends_on:
      db:
        condition: service_healthy
      seafile:
        condition: service_started
    networks:
      - seafile-net

networks:
  seafile-net:
    name: seafile-net
